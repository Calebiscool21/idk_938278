<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline HTML Runner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            background-color: #f6f8fa;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #2ea44f;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        button:hover { background-color: #2c974b; }
        #offlineBtn { background-color: #0366d6; }
        #offlineBtn:hover { background-color: #005cc5; }
        #offlineBtn:disabled { background-color: #6a737d; cursor: not-allowed; }
        .container {
            display: flex;
            gap: 20px;
            flex: 1;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        textarea {
            flex: 1;
            padding: 15px;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            font-family: monospace;
            resize: none;
        }
        iframe {
            flex: 1;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>HTML Runner</h2>
        <div>
            <button id="runBtn">Run Code &raquo;</button>
            <button id="offlineBtn">Enable Offline Mode</button>
        </div>
    </div>

    <div class="container">

        </div>
        <div class="panel">
            <iframe id="outputFrame" sandbox="allow-scripts allow-modals"></iframe>
        </div>
    </div>
